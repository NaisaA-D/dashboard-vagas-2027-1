<!-- Cabeçalho da Tabela (<thead>) -->
<thead>
    <tr class="bg-slate-100/80 border-b border-slate-200 text-slate-700 font-bold uppercase tracking-tight text-[11px]">
        <th class="py-3 px-3">Curso / Modalidade</th>
        <th class="py-3 px-2 text-center">Turno</th>
        
        <!-- Colunas dinâmicas dependendo da Aba -->
        <template x-if="tab === 'vestibular'">
            <th class="py-3 px-2 text-center whitespace-nowrap border-l-2 border-slate-300 bg-slate-200/60 text-slate-800 font-black">Vagas Vest.</th>
        </template>
        <template x-if="tab === 'cebas'">
            <th class="py-3 px-2 text-center whitespace-nowrap border-l-2 border-indigo-300 bg-indigo-100/80 text-indigo-900 font-black">Vagas CEBAS</th>
        </template>
        <template x-if="tab === 'geral'">
            <th class="py-3 px-2 text-center whitespace-nowrap">Vagas Totais</th>
        </template>

        <th class="py-3 px-2 text-center">Inscritos</th>
        
        <!-- Colunas Específicas Vestibular -->
        <template x-if="tab === 'vestibular'">
            <th class="py-3 px-2 text-center border-l border-slate-200">Ingressantes Pagos</th>
        </template>
        <template x-if="tab === 'vestibular'">
            <th class="py-3 px-2 text-center border-r-2 border-slate-300">Limite Turma</th>
        </template>
        <template x-if="tab === 'vestibular'">
            <th class="py-3 px-2 text-center whitespace-normal leading-tight text-red-700 font-extrabold bg-red-50/50">Vagas Restantes<br>na Turma</th>
        </template>

        <!-- Colunas Específicas CEBAS (Somente Formatação Destaque Aplicada) -->
        <template x-if="tab === 'cebas'">
            <th class="py-3 px-2 text-center border-l-2 border-indigo-300 bg-indigo-100/60 text-emerald-800 font-extrabold">Matriculados</th>
        </template>
        <template x-if="tab === 'cebas'">
            <th class="py-3 px-2 text-center bg-indigo-100/60 text-amber-800 font-extrabold">Doc. em Análise</th>
        </template>
        <template x-if="tab === 'cebas'">
            <th class="py-3 px-2 text-center border-r-2 border-indigo-300 bg-indigo-100/60 text-slate-700 font-extrabold">Lista de Espera</th>
        </template>

        <!-- Colunas Visão Geral -->
        <template x-if="tab === 'geral'">
            <th class="py-3 px-2 text-center bg-blue-100/70 text-blue-900 border-l-2 border-blue-400 whitespace-normal font-extrabold leading-tight">Ingressantes<br>Vest.</th>
        </template>
        <template x-if="tab === 'geral'">
            <th class="py-3 px-2 text-center bg-blue-100/70 text-blue-900 whitespace-normal font-extrabold leading-tight">Ingressantes<br>CEBAS</th>
        </template>
        <template x-if="tab === 'geral'">
            <th class="py-3 px-2 text-center bg-blue-100/70 text-blue-900 whitespace-normal font-extrabold leading-tight">Isentos /<br>Outras bolsas</th>
        </template>
        <template x-if="tab === 'geral'">
            <th class="py-3 px-2 text-center bg-blue-100/70 text-blue-900 whitespace-normal font-extrabold leading-tight">Transferência<br>Interna</th>
        </template>
        <template x-if="tab === 'geral'">
            <th class="py-3 px-2 text-center bg-blue-100/70 text-blue-900 whitespace-normal font-extrabold leading-tight">Veteranos<br>Turma</th>
        </template>
        <template x-if="tab === 'geral'">
            <th class="py-3 px-2 text-center bg-blue-200/80 text-blue-950 border-r-2 border-blue-400 whitespace-normal font-black leading-tight">Total<br>Matriculados</th>
        </template>

        <template x-if="tab === 'geral'">
            <th class="py-3 px-2 text-center whitespace-nowrap">Limite Turma</th>
        </template>
        <template x-if="tab === 'geral'">
            <th class="py-3 px-2 text-center whitespace-normal leading-tight text-red-700 font-extrabold bg-red-50/50">Vagas Restantes<br>na Turma</th>
        </template>

        <!-- Colunas Movimentação -->
        <template x-if="tab === 'movimentacao'">
            <th class="py-3 px-2 text-center">Transferência / Ajustes</th>
        </template>
        <template x-if="tab === 'movimentacao'">
            <th class="py-3 px-3">Observações</th>
        </template>
    </tr>
</thead>

<!-- Corpo da Tabela (<tbody>) -->
<tbody class="divide-y divide-slate-100">
    <template x-for="item in filteredList" :key="item.curso + item.periodo">
        <tr class="hover:bg-slate-50/80 transition-colors text-slate-700">
            <!-- Nome do Curso -->
            <td class="py-2.5 px-3 font-semibold text-slate-900 text-xs" x-text="item.curso"></td>
            
            <!-- Periodo -->
            <td class="py-2.5 px-2 text-center">
                <span class="inline-block px-1.5 py-0.5 text-[10px] font-bold uppercase rounded"
                      :class="{
                        'bg-amber-100 text-amber-800': item.periodo === 'Matutino',
                        'bg-indigo-100 text-indigo-800': item.periodo === 'Noturno',
                        'bg-purple-100 text-purple-800': item.periodo === 'Integral',
                        'bg-slate-100 text-slate-700': item.periodo === 'Ead'
                      }"
                      x-text="item.periodo"></span>
            </td>

            <!-- Vagas (Vestibular / CEBAS / Geral) -->
            <template x-if="tab === 'vestibular'">
                <td class="py-2.5 px-2 text-center font-black text-slate-900 border-l-2 border-slate-300 bg-slate-100/50" x-text="item.vagasVestibular"></td>
            </template>
            <template x-if="tab === 'cebas'">
                <td class="py-2.5 px-2 text-center font-black text-indigo-950 border-l-2 border-indigo-300 bg-indigo-50/40" x-text="item.vagasCebas"></td>
            </template>
            <template x-if="tab === 'geral'">
                <td class="py-2.5 px-2 text-center font-bold text-slate-800" x-text="item.vagasVestibular + item.vagasCebas"></td>
            </template>

            <!-- Inscritos -->
            <td class="py-2.5 px-2 text-center font-medium text-slate-600">
                <span x-text="tab === 'cebas' ? item.inscritosCebas : (tab === 'vestibular' ? item.inscritosVestibular : item.inscritosVestibular + item.inscritosCebas)"></span>
            </td>

            <!-- Vestibular Exclusivo -->
            <template x-if="tab === 'vestibular'">
                <td class="py-2.5 px-2 text-center font-semibold text-emerald-600 border-l border-slate-200" x-text="item.ingressantesPagos"></td>
            </template>
            <template x-if="tab === 'vestibular'">
                <td class="py-2.5 px-2 text-center text-slate-500 font-medium border-r-2 border-slate-300" x-text="item.limiteTurma"></td>
            </template>
            <template x-if="tab === 'vestibular'">
                <td class="py-2.5 px-2 text-center font-bold text-red-600 bg-red-50/20" x-text="item.vagasRestantes"></td>
            </template>

            <!-- CEBAS Exclusivo (Apenas formatação de cores e bordas ajustada) -->
            <template x-if="tab === 'cebas'">
                <td class="py-2.5 px-2 text-center font-bold text-emerald-700 bg-indigo-50/20 border-l-2 border-indigo-300" x-text="item.matriculadosCebas"></td>
            </template>
            <template x-if="tab === 'cebas'">
                <td class="py-2.5 px-2 text-center font-bold text-amber-600 bg-indigo-50/20" x-text="item.docAnaliseCebas"></td>
            </template>
            <template x-if="tab === 'cebas'">
                <td class="py-2.5 px-2 text-center font-semibold text-slate-500 bg-indigo-50/20 border-r-2 border-indigo-300" x-text="item.listaEsperaCebas"></td>
            </template>

            <!-- Geral Exclusivo -->
            <template x-if="tab === 'geral'">
                <td class="py-2.5 px-2 text-center font-bold text-emerald-700 bg-blue-50/40 border-l-2 border-blue-300" x-text="item.ingressantesPagos"></td>
            </template>
            <template x-if="tab === 'geral'">
                <td class="py-2.5 px-2 text-center font-bold text-indigo-700 bg-blue-50/40" x-text="item.matriculadosCebas"></td>
            </template>
            <template x-if="tab === 'geral'">
                <td class="py-2.5 px-2 text-center font-bold text-amber-700 bg-blue-50/40" x-text="item.isentosBolsas"></td>
            </template>
            <template x-if="tab === 'geral'">
                <td class="py-2.5 px-2 text-center font-bold text-cyan-700 bg-blue-50/40" x-text="item.vagasMovimentadas"></td>
            </template>
            <template x-if="tab === 'geral'">
                <td class="py-2.5 px-2 text-center font-bold text-purple-700 bg-blue-50/40" x-text="item.matriculasVeteranos"></td>
            </template>
            <template x-if="tab === 'geral'">
                <td class="py-2.5 px-2 text-center font-black text-blue-900 bg-blue-100/50 border-r-2 border-blue-300 text-sm" x-text="item.ingressantesPagos + item.matriculadosCebas + item.isentosBolsas + item.vagasMovimentadas + item.matriculasVeteranos"></td>
            </template>
            <template x-if="tab === 'geral'">
                <td class="py-2.5 px-2 text-center text-slate-500 font-medium" x-text="item.limiteTurma"></td>
            </template>
            <template x-if="tab === 'geral'">
                <td class="py-2.5 px-2 text-center font-bold text-red-600 bg-red-50/20" x-text="item.vagasRestantes"></td>
            </template>

            <!-- Movimentação -->
            <template x-if="tab === 'movimentacao'">
                <td class="py-2.5 px-2 text-center font-semibold" :class="item.vagasMovimentadas > 0 ? 'text-emerald-600' : (item.vagasMovimentadas < 0 ? 'text-rose-600' : 'text-slate-400')" x-text="item.vagasMovimentadas > 0 ? '+' + item.vagasMovimentadas : item.vagasMovimentadas"></td>
            </template>
            <template x-if="tab === 'movimentacao'">
                <td class="py-2.5 px-3 text-xs text-slate-500 italic" x-text="item.observacao || 'Sem observações'"></td>
            </template>
        </tr>
    </template>
</tbody>
